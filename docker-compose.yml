# 🐳 TON Cat Lottery Docker Compose
# 統一管理後端服務和前端應用

services:
  # ================================
  # 後端服務（基礎HTTP服務，準備用於DevOps流程）
  # ================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ton-cat-lottery-backend
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    env_file:
      - .env
    environment:
      - PORT=8080
      - LOTTERY_CONTRACT_ADDRESS=${LOTTERY_CONTRACT_ADDRESS}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - WALLET_MNEMONIC=${WALLET_MNEMONIC}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - production
      - development

  # ================================
  # 前端服務（前端直接用 TON SDK 與區塊鏈互動，不會經過後端）
  # ================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: production
    container_name: ton-cat-lottery-frontend
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    environment:
      - NODE_ENV=production
      - VITE_LOTTERY_CONTRACT_ADDRESS=${LOTTERY_CONTRACT_ADDRESS}
      - VITE_NFT_CONTRACT_ADDRESS=${NFT_CONTRACT_ADDRESS}
    restart: unless-stopped
    volumes:
      - nginx_cache:/var/cache/nginx
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nginx_cache:
    driver: local

