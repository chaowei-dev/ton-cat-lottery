# 🐳 TON Cat Lottery Docker Compose
# 統一管理後端服務和前端應用
services:
  # ================================
  # 後端服務（後端是守護進程，不提供 HTTP API）
  # ================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ton-cat-lottery-backend

  # ================================
  # 前端服務（前端直接用 TON SDK 與區塊鏈互動，不會經過後端）
  # ================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ton-cat-lottery-frontend
    ports:
      - '${FRONTEND_PORT:-3000}:80'  # 根據環境變數決定 port
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

